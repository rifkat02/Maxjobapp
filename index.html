<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Биржа Задач / MAX Messenger</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-20">

  <!-- Шапка -->
  <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow">
    <h1 class="text-xl font-bold text-center">Биржа Задач / Подработка</h1>
  </header>

  <!-- Навигация (Вкладки) -->
  <div class="flex justify-around bg-white border-b sticky top-14 z-10">
    <button id="tabFeedBtn" onclick="switchTab('feed')" class="py-3 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 w-1/2 text-center">
      🔍 Лента вакансий
    </button>
    <button id="tabCreateBtn" onclick="switchTab('create')" class="py-3 px-4 font-semibold text-gray-500 w-1/2 text-center">
      ➕ Разместить
    </button>
  </div>

  <!-- Вкладка 1: Лента вакансий -->
  <main id="feedTab" class="p-4 max-w-lg mx-auto">
    <div class="mb-4 bg-white p-3 rounded-lg shadow-sm space-y-2">
      <select id="categoryFilter" onchange="loadJobs()" class="w-full border rounded p-2 text-sm">
        <option value="">Все категории</option>
        <option value="Строительство">Строительство</option>
        <option value="Погрузка">Погрузка / Разгрузка</option>
        <option value="Уборка">Уборка / Клининг</option>
        <option value="Другое">Другое</option>
      </select>
    </div>

    <div id="jobsList" class="space-y-4">
      <p class="text-center text-gray-500">Загрузка вакансий...</p>
    </div>
  </main>

  <!-- Вкладка 2: Форма подачи объявления -->
  <main id="createTab" class="p-4 max-w-lg mx-auto hidden">
    <form id="jobForm" onsubmit="createJob(event)" class="bg-white p-4 rounded-lg shadow-sm space-y-4">
      <h2 class="font-bold text-lg mb-2">Детали вакансии</h2>
      
      <div>
        <label class="block text-sm font-medium mb-1">Специализация</label>
        <select id="category" required class="w-full border rounded p-2 text-sm">
          <option value="Строительство">Строительство</option>
          <option value="Погрузка">Погрузка / Разгрузка</option>
          <option value="Уборка">Уборка / Клининг</option>
          <option value="Другое">Другое</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Количество человек</label>
        <input type="number" id="workersCount" min="1" value="1" required class="w-full border rounded p-2 text-sm">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Описание задачи</label>
        <textarea id="description" placeholder="Например: Копка земли под кабель 15м" required class="w-full border rounded p-2 text-sm" rows="3"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Дата и время</label>
        <input type="text" id="workDateTime" placeholder="Завтра к 08:00" required class="w-full border rounded p-2 text-sm">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Оплата</label>
        <input type="text" id="salary" placeholder="2 500 руб/смена" required class="w-full border rounded p-2 text-sm">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Локация</label>
        <input type="text" id="location" placeholder="Оренбург, Дзержинский р-н" required class="w-full border rounded p-2 text-sm">
      </div>

      <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg shadow hover:bg-green-700 transition">
        Опубликовать и оплатить (200 ₽)
      </button>
    </form>
  </main>

  <script>
    // Подключение к Supabase с правильным JWT anon ключом
    const SUPABASE_URL = 'https://yaowectkpqumdqkuypn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlhb3dlY3RrcHF1bWRxZ2t1eXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMDU3NzgsImV4cCI6MjEwNzY4MTc3OH0.FMFgseXVsffkdiMecfSIrvdEFZsBWcmPkdu1GNdkc88';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    window.addEventListener('load', () => {
      if (window.MaxChatApp) {
        window.MaxChatApp.ready();
        currentUser = window.MaxChatApp.initDataUnsafe?.user || { id: 123456, first_name: 'Тестовый Пользователь' };
      } else {
        currentUser = { id: 123456, first_name: 'Тест Браузер' };
      }
      loadJobs();
    });

    function switchTab(tab) {
      const feedTab = document.getElementById('feedTab');
      const createTab = document.getElementById('createTab');
      const tabFeedBtn = document.getElementById('tabFeedBtn');
      const tabCreateBtn = document.getElementById('tabCreateBtn');

      if (tab === 'feed') {
        feedTab.classList.remove('hidden');
        createTab.classList.add('hidden');
        tabFeedBtn.className = "py-3 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 w-1/2 text-center";
        tabCreateBtn.className = "py-3 px-4 font-semibold text-gray-500 w-1/2 text-center";
        loadJobs();
      } else {
        createTab.classList.remove('hidden');
        feedTab.classList.add('hidden');
        tabCreateBtn.className = "py-3 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 w-1/2 text-center";
        tabFeedBtn.className = "py-3 px-4 font-semibold text-gray-500 w-1/2 text-center";
      }
    }

    async function loadJobs() {
      const category = document.getElementById('categoryFilter').value;
      let query = supabaseClient.from('jobs').select('*').eq('status', 'active').order('created_at', { ascending: false });
      
      if (category) {
        query = query.eq('category', category);
      }

      const { data: jobs, error } = await query;
      const jobsList = document.getElementById('jobsList');

      if (error || !jobs || jobs.length === 0) {
        jobsList.innerHTML = '<p class="text-center text-gray-500 py-8">Активных вакансий пока нет</p>';
        return;
      }

      jobsList.innerHTML = jobs.map(job => `
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
          <div
