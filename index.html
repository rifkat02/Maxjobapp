<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Биржа Задач / Подработка</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <!-- Шапка -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 text-center font-bold text-lg">
            Биржа Задач / Подработка
        </div>
        <!-- Вкладки -->
        <div class="flex border-b border-blue-500 bg-white">
            <button onclick="switchTab('feed')" id="tab-feed" class="flex-1 py-3 text-center font-medium text-blue-600 border-b-2 border-blue-600 transition">
                🔍 Лента вакансий
            </button>
            <button onclick="switchTab('post')" id="tab-post" class="flex-1 py-3 text-center font-medium text-gray-500 hover:text-blue-600 transition">
                ➕ Разместить
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-20">
        <!-- Вкладка: Лента вакансий -->
        <div id="content-feed" class="space-y-4">
            <div class="bg-white p-3 rounded-lg shadow-sm">
                <select id="category-filter" onchange="loadJobs()" class="w-full p-2 border rounded-md bg-gray-50 text-sm">
                    <option value="">Все категории</option>
                    <option value="Строительство">Строительство</option>
                    <option value="Доставка">Доставка</option>
                    <option value="Уборка">Уборка</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>
            <div id="jobs-list" class="space-y-3">
                <p class="text-center text-gray-500 py-6">Загрузка вакансий...</p>
            </div>
        </div>

        <!-- Вкладка: Разместить вакансию -->
        <div id="content-post" class="hidden space-y-4 bg-white p-4 rounded-lg shadow-sm">
            <h2 class="text-lg font-bold mb-2">Новая задача</h2>
            <form id="job-form" onsubmit="submitJob(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Специализация</label>
                    <select id="job-category" class="w-full p-2 border rounded-md text-sm">
                        <option value="Строительство">Строительство</option>
                        <option value="Доставка">Доставка</option>
                        <option value="Уборка">Уборка</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Количество человек</label>
                    <input type="number" id="job-workers" value="1" min="1" class="w-full p-2 border rounded-md text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Описание задачи</label>
                    <textarea id="job-desc" rows="3" class="w-full p-2 border rounded-md text-sm" placeholder="Опишите суть работы..." required></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Дата и время</label>
                    <input type="text" id="job-datetime" placeholder="Например: Завтра в 10:00" class="w-full p-2 border rounded-md text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Оплата (руб.)</label>
                    <input type="number" id="job-salary" placeholder="2500" class="w-full p-2 border rounded-md text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Локация</label>
                    <input type="text" id="job-location" placeholder="Город, улица, ориентир" class="w-full p-2 border rounded-md text-sm" required>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-md font-bold text-sm hover:bg-green-700 transition">
                    Опубликовать вакансию
                </button>
            </form>
        </div>
    </main>

    <script>
        function switchTab(tab) {
            const feedTab = document.getElementById('tab-feed');
            const postTab = document.getElementById('tab-post');
            const feedContent = document.getElementById('content-feed');
            const postContent = document.getElementById('content-post');

            if (tab === 'feed') {
                feedTab.className = "flex-1 py-3 text-center font-medium text-blue-600 border-b-2 border-blue-600 transition";
                postTab.className = "flex-1 py-3 text-center font-medium text-gray-500 hover:text-blue-600 transition";
                feedContent.classList.remove('hidden');
                postContent.classList.add('hidden');
                loadJobs();
            } else {
                postTab.className = "flex-1 py-3 text-center font-medium text-blue-600 border-b-2 border-blue-600 transition";
                feedTab.className = "flex-1 py-3 text-center font-medium text-gray-500 hover:text-blue-600 transition";
                postContent.classList.remove('hidden');
                feedContent.classList.add('hidden');
            }
        }

        async function loadJobs() {
            const category = document.getElementById('category-filter').value;
            const listEl = document.getElementById('jobs-list');
            listEl.innerHTML = '<p class="text-center text-gray-500 py-6">Загрузка вакансий...</p>';

            try {
                let url = '/api/jobs';
                if (category) url += `?category=${encodeURIComponent(category)}`;

                const res = await fetch(url);
                const json = await res.json();

                if (!json.success) throw new Error(json.error || 'Ошибка загрузки');

                if (!json.data || json.data.length === 0) {
                    listEl.innerHTML = '<p class="text-center text-gray-500 py-6">Активных вакансий пока нет</p>';
                    return;
                }

                listEl.innerHTML = json.data.map(job => `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 space-y-2">
                        <div class="flex justify-between items-start">
                            <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-medium">${job.category}</span>
                            <span class="text-green-600 font-bold text-sm">${job.salary} ₽</span>
                        </div>
                        <p class="text-sm text-gray-700">${job.description}</p>
                        <div class="text-xs text-gray-500 space-y-1 pt-1 border-t border-gray-50">
                            <div>📍 ${job.location}</div>
                            <div>🕒 ${job.work_date_time}</div>
                            <div>👥 Требуется людей: ${job.workers_count}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<p class="text-center text-red-500 py-6">Ошибка: ${err.message}</p>`;
            }
        }

        async function submitJob(e) {
            e.preventDefault();

            const jobData = {
                category: document.getElementById('job-category').value,
                workers_count: parseInt(document.getElementById('job-workers').value),
                description: document.getElementById('job-desc').value,
                work_date_time: document.getElementById('job-datetime').value,
                salary: parseFloat(document.getElementById('job-salary').value),
                location: document.getElementById('job-location').value
            };

            const user = {
                id: 'user_' + Math.random().toString(36).substring(2, 9),
                first_name: 'Пользователь'
            };

            try {
                const res = await fetch('/api/jobs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, job: jobData })
                });

                const json = await res.json();
                if (!json.success) throw new Error(json.error || 'Ошибка публикации');

                alert(json.message || 'Успешно!');
                document.getElementById('job-form').reset();
                switchTab('feed');
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        loadJobs();
    </script>
</body>
</html>
